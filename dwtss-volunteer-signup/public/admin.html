<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin | DWTSS Volunteer Sign-Up</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2A1636; --ink-soft: #5E4F6B; --lilac: #E9DFF6; --lilac-mid: #CDBBE6;
    --gold: #A9822F; --paper: #FBFAFD; --line: #DDD3EA; --ok: #2F6B4F; --err: #A33A3A;
    --serif: 'DM Serif Display', Georgia, serif; --sans: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
  header { background: var(--lilac); border-bottom: 3px double var(--ink); padding: 1.1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  header h1 { font-family: var(--serif); font-weight: 400; font-size: 1.6rem; margin: 0; }
  header p { margin: 0; color: var(--ink-soft); font-size: .9rem; }
  main { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1.1rem 4rem; }
  button { font: inherit; cursor: pointer; border-radius: 4px; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: .4rem .8rem; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  button.danger { color: var(--err); border-color: #E7C6C6; }
  button.small { padding: .2rem .55rem; font-size: .85rem; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  input, select, textarea { font: inherit; padding: .4rem .55rem; border: 1px solid var(--lilac-mid); border-radius: 4px; background: #fff; color: var(--ink); width: 100%; }
  textarea { min-height: 3.2rem; resize: vertical; }
  label { font-size: .82rem; font-weight: 600; display: flex; flex-direction: column; gap: .2rem; }
  label.check { flex-direction: row; align-items: center; gap: .45rem; font-weight: 500; }
  label.check input { width: auto; }

  .gate { max-width: 22rem; margin: 4rem auto; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 1.5rem; }
  .gate h2 { font-family: var(--serif); font-weight: 400; margin: 0 0 1rem; }
  .gate form { display: grid; gap: .8rem; }

  .stats { display: flex; gap: 2rem; flex-wrap: wrap; margin: 0 0 1.25rem; }
  .stats div { font-size: .9rem; color: var(--ink-soft); }
  .stats b { display: block; font-family: var(--serif); font-weight: 400; font-size: 2rem; color: var(--ink); line-height: 1.1; }
  .tabs { display: flex; gap: .4rem; border-bottom: 1px solid var(--line); margin-bottom: 1.25rem; flex-wrap: wrap; align-items: flex-end; }
  .tabs button { border: 1px solid transparent; border-bottom: none; border-radius: 4px 4px 0 0; background: transparent; padding: .55rem 1rem; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { background: #fff; border-color: var(--line); font-weight: 700; }
  .tabs .spacer { flex: 1; }
  .tabs .tool { margin-bottom: .4rem; }

  .block { background: #fff; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 1rem; overflow: hidden; }
  .block-head { background: var(--lilac); padding: .65rem 1rem; display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; }
  .block-head h3 { margin: 0; font-size: 1rem; }
  .block-head .meta { font-size: .85rem; color: var(--ink-soft); }
  .block-head .meta.over { color: var(--err); font-weight: 600; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: .5rem 1rem; border-top: 1px solid var(--line); vertical-align: middle; }
  th { font-size: .8rem; color: var(--ink-soft); font-weight: 600; }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions button + button { margin-left: .35rem; }
  .empty { padding: .7rem 1rem; color: var(--ink-soft); font-size: .9rem; border-top: 1px solid var(--line); margin: 0; }
  .inline-form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: .6rem; padding: .8rem 1rem; border-top: 1px dashed var(--lilac-mid); align-items: end; }
  .inline-form .btns { display: flex; gap: .4rem; }

  .role-form { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .7rem; padding: 1rem; }
  .role-form .w2 { grid-column: span 2; } .role-form .w3 { grid-column: span 3; } .role-form .w6 { grid-column: 1 / -1; }
  .role-form .btns { grid-column: 1 / -1; display: flex; gap: .5rem; flex-wrap: wrap; }
  .hidden-tag { font-size: .75rem; background: #F1ECF7; border: 1px solid var(--line); border-radius: 3px; padding: .05rem .4rem; margin-left: .4rem; font-weight: 500; }

  .toast { position: fixed; left: 50%; bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: .6rem 1rem; border-radius: 4px; font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; }
  .toast.show { opacity: 1; } .toast.err { background: var(--err); }
  @media (max-width: 720px) {
    .inline-form { grid-template-columns: 1fr 1fr; } .inline-form .btns { grid-column: 1 / -1; }
    .role-form { grid-template-columns: 1fr 1fr; } .role-form .w2, .role-form .w3 { grid-column: span 1; } .role-form .w6 { grid-column: 1 / -1; }
  }
  @media (max-width: 460px) { .role-form .w2, .role-form .w3 { grid-column: 1 / -1; } }
</style>
</head>
<body>
<header>
  <div><h1>Volunteer admin</h1><p>Dancing with the Shasta Stars: Broadway Edition, October 17, 2026</p></div>
  <div id="headActions"></div>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const API = '/.netlify/functions/volunteers';
let pass = '';
try { pass = sessionStorage.getItem('dwtss-admin') || ''; } catch (e) {}
let state = { roles: [], bookings: [] };
let tab = 'volunteers';
let editing = null;      // { type: 'booking'|'role', id }
let adding = null;       // roleId for add volunteer, or 'role'
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = () => document.getElementById('app');

function toast(text, isErr) {
  const t = document.getElementById('toast');
  t.textContent = text; t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 2600);
}

async function api(method, body) {
  const res = await fetch(API + (method === 'GET' ? '?admin=1' : ''), {
    method, cache: 'no-store',
    headers: { 'Content-Type': 'application/json', 'x-admin-passcode': pass },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { pass = ''; try { sessionStorage.removeItem('dwtss-admin'); } catch (e) {} showGate('That passcode didn\'t work. Try again.'); throw new Error('locked'); }
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  if (data.roles) state = { roles: data.roles, bookings: data.bookings || [] };
  return data;
}

async function act(body, doneText) {
  try { await api('POST', body); editing = null; adding = null; render(); toast(doneText); }
  catch (e) { if (e.message !== 'locked') toast(e.message, true); }
}

function showGate(msg) {
  document.getElementById('headActions').innerHTML = '';
  app().innerHTML = `
  <div class="gate">
    <h2>Enter passcode</h2>
    <form onsubmit="unlock(event)">
      <label>Admin passcode<input type="password" id="pw" required autofocus></label>
      ${msg ? `<p style="color:var(--err);margin:0;font-size:.9rem">${esc(msg)}</p>` : ''}
      <button class="primary" type="submit">Unlock</button>
    </form>
  </div>`;
}

async function unlock(e) {
  e.preventDefault();
  pass = document.getElementById('pw').value;
  try { await api('GET'); try { sessionStorage.setItem('dwtss-admin', pass); } catch (er) {} render(); } catch (er) { if (er.message !== 'locked') showGate(er.message); }
}

function lock() { pass = ''; try { sessionStorage.removeItem('dwtss-admin'); } catch (e) {} showGate(); }

async function refresh() { try { await api('GET'); render(); toast('Refreshed'); } catch (e) { if (e.message !== 'locked') toast(e.message, true); } }

function render() {
  document.getElementById('headActions').innerHTML = `<button onclick="refresh()">Refresh</button> <button onclick="lock()">Lock</button>`;
  const visible = state.roles.filter(r => r.visible !== false);
  const total = visible.reduce((n, r) => n + r.needed, 0);
  const filled = visible.reduce((n, r) => n + Math.min(state.bookings.filter(b => b.roleId === r.id).length, r.needed), 0);
  app().innerHTML = `
    <div class="stats">
      <div><b>${filled}</b>spots filled</div>
      <div><b>${Math.max(total - filled, 0)}</b>spots open</div>
      <div><b>${new Set(state.bookings.map(b => b.name.toLowerCase())).size}</b>volunteers</div>
      <div><b>${state.roles.length}</b>roles</div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="${tab === 'volunteers'}" onclick="setTab('volunteers')">Volunteers</button>
      <button role="tab" aria-selected="${tab === 'roles'}" onclick="setTab('roles')">Roles</button>
      <span class="spacer"></span>
      ${tab === 'volunteers' ? `<button class="tool" onclick="exportCsv()">Download CSV</button>` : `<button class="tool primary" onclick="startAddRole()">Add role</button>`}
    </div>
    ${tab === 'volunteers' ? volunteersView() : rolesView()}`;
}

function setTab(t) { tab = t; editing = null; adding = null; render(); }

/* ---------- Volunteers tab ---------- */
function volunteersView() {
  if (!state.roles.length) return '<p>No roles yet. Add one on the Roles tab.</p>';
  return state.roles.map(r => {
    const people = state.bookings.filter(b => b.roleId === r.id);
    const over = people.length > r.needed;
    return `
    <div class="block">
      <div class="block-head">
        <h3>${esc(r.name)}${r.visible === false ? '<span class="hidden-tag">Hidden</span>' : ''}</h3>
        <span class="meta ${over ? 'over' : ''}">${esc(r.category)}, ${esc(r.time)} &nbsp;|&nbsp; ${people.length} of ${r.needed} filled${over ? ' (over capacity)' : ''}</span>
      </div>
      ${people.length ? `<div class="scroll"><table>
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Signed up</th><th></th></tr></thead>
        <tbody>${people.map(b => editing && editing.type === 'booking' && editing.id === b.id ? bookingEditRow(b) : bookingRow(b)).join('')}</tbody>
      </table></div>` : '<p class="empty">No one signed up yet.</p>'}
      ${adding === r.id ? addBookingForm(r.id) : `<p class="empty"><button class="small" onclick="startAdd('${r.id}')">Add volunteer</button></p>`}
    </div>`;
  }).join('');
}

function bookingRow(b) {
  const d = b.createdAt ? new Date(b.createdAt).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
  return `<tr>
    <td>${esc(b.name)}</td>
    <td>${b.email ? `<a href="mailto:${esc(b.email)}">${esc(b.email)}</a>` : ''}</td>
    <td>${esc(b.phone)}</td>
    <td>${d}${b.addedByAdmin ? ' (added by admin)' : ''}</td>
    <td class="actions"><button class="small" onclick="startEdit('${b.id}')">Edit</button><button class="small danger" onclick="removeBooking('${b.id}')">Remove</button></td>
  </tr>`;
}

function bookingEditRow(b) {
  return `<tr><td colspan="5" style="padding:0">
    <form class="inline-form" onsubmit="saveBooking(event, '${b.id}')">
      <label>Name<input name="n" value="${esc(b.name)}" required></label>
      <label>Email<input name="e" type="email" value="${esc(b.email)}"></label>
      <label>Phone<input name="p" value="${esc(b.phone)}"></label>
      <label>Role<select name="r">${state.roles.map(r => `<option value="${r.id}" ${r.id === b.roleId ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></label>
      <div class="btns"><button class="primary small" type="submit">Save</button><button class="small" type="button" onclick="cancel()">Cancel</button></div>
    </form></td></tr>`;
}

function addBookingForm(roleId) {
  return `<form class="inline-form" onsubmit="addBooking(event, '${roleId}')">
    <label>Name<input name="n" required></label>
    <label>Email<input name="e" type="email"></label>
    <label>Phone<input name="p"></label>
    <span></span>
    <div class="btns"><button class="primary small" type="submit">Add</button><button class="small" type="button" onclick="cancel()">Cancel</button></div>
  </form>`;
}

function startAdd(id) { adding = id; editing = null; render(); document.querySelector('.inline-form input')?.focus(); }
function startEdit(id) { editing = { type: 'booking', id }; adding = null; render(); }
function cancel() { editing = null; adding = null; render(); }
const v = (f, n) => f.elements[n].value;
function addBooking(e, roleId) { e.preventDefault(); const f = e.target; act({ action: 'addBooking', roleId, name: v(f,'n'), email: v(f,'e'), phone: v(f,'p') }, 'Volunteer added'); }
function saveBooking(e, id) { e.preventDefault(); const f = e.target; act({ action: 'updateBooking', id, name: v(f,'n'), email: v(f,'e'), phone: v(f,'p'), roleId: v(f,'r') }, 'Changes saved'); }
function removeBooking(id) {
  const b = state.bookings.find(x => x.id === id);
  if (confirm(`Remove ${b ? b.name : 'this volunteer'} from this role?`)) act({ action: 'deleteBooking', id }, 'Volunteer removed');
}

/* ---------- Roles tab ---------- */
function rolesView() {
  const cats = [...new Set(state.roles.map(r => r.category))];
  const datalist = `<datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>`;
  const addForm = adding === 'role' ? `<div class="block"><div class="block-head"><h3>New role</h3></div>${roleForm(null)}</div>` : '';
  return datalist + addForm + (state.roles.length ? state.roles.map(r => {
    const count = state.bookings.filter(b => b.roleId === r.id).length;
    const isEditing = editing && editing.type === 'role' && editing.id === r.id;
    return `<div class="block">
      <div class="block-head">
        <h3>${esc(r.name)}${r.visible === false ? '<span class="hidden-tag">Hidden</span>' : ''}</h3>
        <span class="meta">Order ${r.order} &nbsp;|&nbsp; ${count} of ${r.needed} filled</span>
      </div>
      ${isEditing ? roleForm(r) : `
      <div style="padding:.8rem 1rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center">
        <div style="max-width:40rem"><div style="font-size:.88rem;color:var(--ink-soft)">${esc(r.category)}, ${esc(r.time)}</div><div>${esc(r.description)}</div></div>
        <div style="white-space:nowrap"><button class="small" onclick="editRole('${r.id}')">Edit</button> <button class="small danger" onclick="deleteRole('${r.id}')">Delete</button></div>
      </div>`}
    </div>`;
  }).join('') : '<p>No roles yet.</p>');
}

function roleForm(r) {
  const x = r || { category: '', name: '', time: '', needed: 2, description: '', order: (Math.max(0, ...state.roles.map(q => q.order || 0)) + 10), visible: true };
  return `<form class="role-form" onsubmit="saveRole(event, ${r ? `'${r.id}'` : 'null'})">
    <label class="w3">Role name<input name="name" value="${esc(x.name)}" required></label>
    <label class="w3">Section<input name="category" list="cats" value="${esc(x.category)}" placeholder="Before the show" required></label>
    <label class="w3">Time<input name="time" value="${esc(x.time)}" placeholder="5:00 pm to 7:00 pm"></label>
    <label>Spots<input name="needed" type="number" min="1" value="${x.needed}" required></label>
    <label>Order<input name="order" type="number" value="${x.order}"></label>
    <label class="check w6"><input name="visible" type="checkbox" ${x.visible !== false ? 'checked' : ''}> Show on the public sign-up page</label>
    <label class="w6">Description<textarea name="description">${esc(x.description)}</textarea></label>
    <div class="btns"><button class="primary" type="submit">${r ? 'Save role' : 'Add role'}</button><button type="button" onclick="cancel()">Cancel</button></div>
  </form>`;
}

function startAddRole() { adding = 'role'; editing = null; render(); document.querySelector('.role-form input')?.focus(); }
function editRole(id) { editing = { type: 'role', id }; adding = null; render(); }
function saveRole(e, id) {
  e.preventDefault(); const f = e.target;
  const role = { name: v(f,'name'), category: v(f,'category'), time: v(f,'time'), needed: v(f,'needed'), order: v(f,'order'), description: v(f,'description'), visible: f.elements['visible'].checked };
  act(id ? { action: 'updateRole', id, role } : { action: 'addRole', role }, id ? 'Role saved' : 'Role added');
}
function deleteRole(id) {
  const r = state.roles.find(x => x.id === id);
  const n = state.bookings.filter(b => b.roleId === id).length;
  if (confirm(`Delete "${r.name}"?${n ? ` This also removes the ${n} volunteer${n > 1 ? 's' : ''} signed up for it.` : ''}`)) act({ action: 'deleteRole', id }, 'Role deleted');
}

/* ---------- CSV ---------- */
function exportCsv() {
  const q = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const rows = [['Role', 'Section', 'Time', 'Name', 'Email', 'Phone', 'Signed up']];
  state.roles.forEach(r => state.bookings.filter(b => b.roleId === r.id).forEach(b =>
    rows.push([r.name, r.category, r.time, b.name, b.email, b.phone, b.createdAt ? new Date(b.createdAt).toLocaleString() : ''])));
  const blob = new Blob([rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'dwtss-volunteers.csv'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

if (pass) { api('GET').then(render).catch(e => { if (e.message !== 'locked') showGate(e.message); }); }
else showGate();
</script>
</body>
</html>
